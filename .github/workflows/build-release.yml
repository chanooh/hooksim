name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/hooksim-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hooksim-release-apk
          path: artifacts/hooksim-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" artifacts/hooksim-release.apk \
            --target "$GITHUB_SHA" \
            --title "HookSim ${tag}" \
            --notes "LSPosed API 101 module that hooks TelephonyManager#getSimCountryIso() and returns JP."
